    <g transform="translate(30 28) rotate(45)" fill="#171310" stroke="#171310" stroke-width="4"
       stroke-linejoin="round">
      <path d="M0 22 C-18 12 -16 -8 0 -24 C16 -8 18 12 0 22 Z"/>
    </g>
  </g>
  <g transform="translate(30 28) rotate(45)" stroke="#171310" stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M0 22 L0 30" stroke-width="4"/>
    <path d="M0 22 C-18 12 -16 -8 0 -24 C16 -8 18 12 0 22 Z" fill="#7ED957" stroke-width="4"/>
    <path d="M0 18 L0 -15" stroke-width="3" fill="none"/>
    <path d="M0 8 L-7 1 M0 8 L7 1 M0 -2 L-5 -7 M0 -2 L5 -7" stroke-width="2.5" fill="none"/>
  </g>
</svg>
