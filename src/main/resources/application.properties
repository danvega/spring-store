spring.application.name=spring-store

gg.jte.development-mode=true

# Start Postgres with the app but leave it running afterwards, so a database client
# keeps working between restarts. The default stops the container on shutdown.
spring.docker.compose.lifecycle-management=start-only

# Local keys live in secrets.properties, which is git ignored. Optional, so the app
# still runs from environment variables anywhere else.
spring.config.import=optional:file:./secrets.properties

# Stripe. The empty defaults are deliberate: they let binding run so StripeProperties can
# fail validation with a message worth reading, rather than failing earlier with a raw
# "could not resolve placeholder". Both refuse to start. Only one of them helps.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.base-url=${STRIPE_BASE_URL:http://localhost:8080}
