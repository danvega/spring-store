<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{--cream:#FDF6E3;--ink:#171310}
body{background:var(--cream);color:var(--ink);font-family:'Baloo 2',ui-rounded,system-ui,sans-serif}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.card{border:4px solid var(--ink);border-radius:1.75rem;background:var(--cream);box-shadow:8px 8px 0 0 var(--ink)}
.tile{border:4px solid var(--ink);border-radius:1.5rem;box-shadow:6px 6px 0 0 var(--ink)}
.pill{border:3px solid var(--ink);border-radius:999px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:.8rem}
.btn-solid{background:var(--ink);color:var(--cream);border-radius:999px;font-weight:800}
.btn-hollow{border:3px solid var(--ink);border-radius:999px;font-weight:800}
.qty{border:3px solid var(--ink);border-radius:999px;font-weight:800;width:2.25rem;height:2.25rem;display:inline-flex;align-items:center;justify-content:center}
</style>
<title>Empty cart</title>
<body class="p-6 md:p-10"><main class="mx-auto max-w-3xl">
<div class="card p-8 md:p-12">
  <h1 class="text-4xl md:text-5xl font-extrabold">Your cart is empty.</h1>
  <p class="mt-4 text-lg font-medium opacity-80 max-w-xl">
    You have not picked anything yet. The stickers are still on the sheet.</p>
  <div class="mt-8 flex gap-3">
    <div class="tile w-24 h-24" style="background:#E8E0CC;box-shadow:none;border-style:dashed;border-width:3px"></div>
    <div class="tile w-24 h-24" style="background:#E8E0CC;box-shadow:none;border-style:dashed;border-width:3px"></div>
    <div class="tile w-24 h-24" style="background:#E8E0CC;box-shadow:none;border-style:dashed;border-width:3px"></div>
  </div>
  <a href="3-storefront.html" class="btn-solid inline-block mt-8 px-8 py-4 text-lg">Back to the stickers</a>
</div></main>
